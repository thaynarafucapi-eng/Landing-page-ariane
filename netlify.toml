# Configuração de publicação no Netlify
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Prévias de pull request e branches: mostram os marcadores das fotos
# pendentes e bloqueiam indexação (robots.txt gerado com Disallow).
[context.deploy-preview.environment]
  PUBLIC_SHOW_PHOTO_PLACEHOLDERS = "true"

[context.branch-deploy.environment]
  PUBLIC_SHOW_PHOTO_PLACEHOLDERS = "true"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/marca/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
